    <!-- CSS CRÍTICO: Esconder fotos de pesquisadores em mobile - PRIORIDADE MÁXIMA -->
    <style id="critical-hide-photos">
      @media screen and (max-width: 820px) {
        /* Esconder TODOS os containers de foto de pesquisadores */
        [class*="box2"],
        [class*="Box2"],
        [class*="_box2_"],
        [class*="_Box2_"],
        div[class*="box2"],
        .researcher-photo-box,
        .researcher-photo-container,
        [data-researcher-photo],
        div[style*="background"][style*="url"] {
          display: none !important;
          visibility: hidden !important;
          width: 0 !important;
          height: 0 !important;
          max-width: 0 !important;
          max-height: 0 !important;
          min-width: 0 !important;
          min-height: 0 !important;
          opacity: 0 !important;
          overflow: hidden !important;
          position: absolute !important;
          left: -99999px !important;
          top: -99999px !important;
          pointer-events: none !important;
          background: transparent !important;
          background-image: none !important;
          background-color: transparent !important;
          border: none !important;
          padding: 0 !important;
          margin: 0 !important;
        }
      }
    </style>
