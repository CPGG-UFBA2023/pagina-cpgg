<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrindo página antiga do CPGG</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f6f8;
        color: #17212b;
      }

      main {
        width: min(100%, 520px);
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 20px 50px rgba(23, 33, 43, 0.14);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 20px;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: #17212b;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Abrindo a página antiga do CPGG</h1>
      <p>Se o redirecionamento não acontecer automaticamente, use o botão abaixo.</p>
      <a id="legacy-link" href="http://www2.cpgg.ufba.br/">Abrir página antiga</a>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const targetUrl = params.get('target') || 'http://www2.cpgg.ufba.br/';
      const link = document.getElementById('legacy-link');

      if (link) {
        link.href = targetUrl;
      }

      window.location.replace(targetUrl);
    </script>
  </body>
</html>
